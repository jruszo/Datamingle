global:
  scrape_interval: 15s

scrape_configs:
  - job_name: victoriametrics-local-dev
    metrics_path: /metrics
    static_configs:
      - targets:
          - victoriametrics-local-dev:8428

  - job_name: quickwit
    metrics_path: /metrics
    static_configs:
      - targets:
          - quickwit:7280
          - quickwit-worker:7280

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000
