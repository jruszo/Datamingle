name: datamingle-demo-dbs

services:
  mysql_demo:
    image: mysql:8.0
    container_name: datamingle-mysql-demo
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - "./mysql-demo/init:/docker-entrypoint-initdb.d:ro"
    environment:
      MYSQL_DATABASE: demo_orders
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: demo_datamingle
      MYSQL_PASSWORD: demo123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udemo_datamingle", "-pdemo123"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - datamingle

  postgres_demo:
    image: postgres:16-alpine
    container_name: datamingle-postgres-demo
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - "./postgres-demo/init:/docker-entrypoint-initdb.d:ro"
    environment:
      POSTGRES_DB: workflow_pg
      POSTGRES_USER: demo_datamingle
      POSTGRES_PASSWORD: demo123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_datamingle -d workflow_pg"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - datamingle

networks:
  datamingle:
    external: true
