version: '3'

services:
  redis:
    image: redis:5
    container_name: redis
    restart: always
    command: redis-server --requirepass 123456
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - "./mysql/my.cnf:/etc/mysql/my.cnf"
      - "./mysql/datadir:/var/lib/mysql"
    environment:
      MYSQL_DATABASE: datamingle
      MYSQL_ROOT_PASSWORD: 123456
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  goinception:
    image: hanchuanchuan/goinception
    container_name: goinception
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - "./inception/config.toml:/etc/config.toml"

  datamingle:
    # Local image tag. Build and tag it before using this compose file:
    # docker build -f ../docker/Dockerfile -t datamingle-app:latest ../../..
    # Published images can replace this with your registry reference.
    image: datamingle-app:latest
    container_name: datamingle-app
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "9123:9123"
    volumes:
      - "./datamingle/settings.py:/opt/datamingle/backend/local_settings.py"
      - "./datamingle/docs.md:/opt/datamingle/backend/docs/docs.md"
      - "./datamingle/downloads:/opt/datamingle/backend/downloads"
      - "./datamingle/sql/migrations:/opt/datamingle/backend/sql/migrations"
      - "./datamingle/logs:/opt/datamingle/backend/logs"
      - "./datamingle/keys:/opt/datamingle/backend/keys"
    environment:
      RUN_MIGRATIONS_ON_START: "1"
    entrypoint: "bash /opt/datamingle/backend/src/docker/startup.sh"
    env_file:
      - .env

  celery:
    image: datamingle-app:latest
    container_name: datamingle-celery
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      datamingle:
        condition: service_started
    volumes:
      - "./datamingle/settings.py:/opt/datamingle/backend/local_settings.py"
      - "./datamingle/docs.md:/opt/datamingle/backend/docs/docs.md"
      - "./datamingle/downloads:/opt/datamingle/backend/downloads"
      - "./datamingle/sql/migrations:/opt/datamingle/backend/sql/migrations"
      - "./datamingle/logs:/opt/datamingle/backend/logs"
      - "./datamingle/keys:/opt/datamingle/backend/keys"
    env_file:
      - .env
    entrypoint: >-
      bash -lc "cd /opt/datamingle/backend &&
      source /opt/venv4datamingle/bin/activate &&
      celery -A archery worker -l info -Q ${CELERY_TASK_DEFAULT_QUEUE:-datamingle-default}"

  celerybeat:
    image: datamingle-app:latest
    container_name: datamingle-celerybeat
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      datamingle:
        condition: service_started
    volumes:
      - "./datamingle/settings.py:/opt/datamingle/backend/local_settings.py"
      - "./datamingle/docs.md:/opt/datamingle/backend/docs/docs.md"
      - "./datamingle/downloads:/opt/datamingle/backend/downloads"
      - "./datamingle/sql/migrations:/opt/datamingle/backend/sql/migrations"
      - "./datamingle/logs:/opt/datamingle/backend/logs"
      - "./datamingle/keys:/opt/datamingle/backend/keys"
    env_file:
      - .env
    entrypoint: >-
      bash -lc "cd /opt/datamingle/backend &&
      source /opt/venv4datamingle/bin/activate &&
      celery -A archery beat -l info --schedule /tmp/celerybeat-schedule"
