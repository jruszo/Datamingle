services:
  redis:
    image: redis:7-alpine
    container_name: datamingle-redis
    restart: always
    command: redis-server --requirepass 123456
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: datamingle-mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - "./mysql/my.cnf:/etc/mysql/my.cnf"
    environment:
      MYSQL_DATABASE: datamingle
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: 123456
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  datamingle:
    image: datamingle-app:local-dev
    container_name: datamingle-app
    restart: always
    build:
      context: ../../..
      dockerfile: backend/src/docker/Dockerfile.local-dev
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "9123:9123"
    volumes:
      - "../../..:/opt/datamingle"
      - "./datamingle/settings.py:/opt/datamingle/backend/local_settings.py"
      - "./datamingle/docs.md:/opt/datamingle/backend/docs/docs.md"
      - "./datamingle/downloads:/opt/datamingle/backend/downloads"
      - "./datamingle/logs:/opt/datamingle/backend/logs"
      - "./datamingle/keys:/opt/datamingle/backend/keys"
    environment:
      RUN_MIGRATIONS_ON_START: "1"
      RUN_LOCAL_DEMO_SEED: "1"
      GUNICORN_RELOAD: "1"
      DATAMINGLE_SERVE_ASGI: "1"
    entrypoint: "bash /opt/datamingle/backend/src/docker/startup.sh"
    env_file:
      - .env.local-dev
    networks:
      - default
      - datamingle

  celery:
    image: datamingle-app:local-dev
    container_name: datamingle-celery
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      datamingle:
        condition: service_started
    volumes:
      - "../../..:/opt/datamingle"
      - "./datamingle/settings.py:/opt/datamingle/backend/local_settings.py"
      - "./datamingle/docs.md:/opt/datamingle/backend/docs/docs.md"
      - "./datamingle/downloads:/opt/datamingle/backend/downloads"
      - "./datamingle/logs:/opt/datamingle/backend/logs"
      - "./datamingle/keys:/opt/datamingle/backend/keys"
    env_file:
      - .env.local-dev
    networks:
      - default
      - datamingle
    entrypoint: >-
      bash -lc "cd /opt/datamingle/backend &&
      source /opt/venv4datamingle/bin/activate &&
      celery -A archery worker -l info -Q ${CELERY_TASK_DEFAULT_QUEUE:-datamingle-default}"

  celerybeat:
    image: datamingle-app:local-dev
    container_name: datamingle-celerybeat
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      datamingle:
        condition: service_started
    volumes:
      - "../../..:/opt/datamingle"
      - "./datamingle/settings.py:/opt/datamingle/backend/local_settings.py"
      - "./datamingle/docs.md:/opt/datamingle/backend/docs/docs.md"
      - "./datamingle/downloads:/opt/datamingle/backend/downloads"
      - "./datamingle/logs:/opt/datamingle/backend/logs"
      - "./datamingle/keys:/opt/datamingle/backend/keys"
    env_file:
      - .env.local-dev
    networks:
      - default
      - datamingle
    entrypoint: >-
      bash -lc "cd /opt/datamingle/backend &&
      source /opt/venv4datamingle/bin/activate &&
      celery -A archery beat -l info --schedule /tmp/celerybeat-schedule"

  frontend:
    image: node:22-bookworm-slim
    container_name: datamingle-frontend
    restart: always
    working_dir: /opt/datamingle/frontend
    depends_on:
      datamingle:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - "../../..:/opt/datamingle"
      - frontend_node_modules:/opt/datamingle/frontend/node_modules
    environment:
      VITE_API_BASE_URL: /api
      VITE_BACKEND_PROXY_TARGET: http://datamingle:9123
    entrypoint: >-
      bash -lc "npm ci &&
      npm run dev -- --host 0.0.0.0"

networks:
  datamingle:
    external: true

volumes:
  frontend_node_modules:
