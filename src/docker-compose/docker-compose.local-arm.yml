services:
  redis:
    image: redis:7-alpine
    container_name: datamingle-redis
    restart: always
    command: redis-server --requirepass 123456
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: datamingle-mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - "./mysql/my.cnf:/etc/mysql/my.cnf"
      - "./mysql/datadir:/var/lib/mysql"
    environment:
      MYSQL_DATABASE: archery
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: 123456
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  goinception:
    image: hanchuanchuan/goinception
    platform: linux/amd64
    container_name: datamingle-goinception
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - "./inception/config.toml:/etc/config.toml"

  mysql_demo:
    image: mysql:8.0
    container_name: datamingle-mysql-demo
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_demo_data:/var/lib/mysql
      - "./mysql-demo/init:/docker-entrypoint-initdb.d:ro"
    environment:
      MYSQL_DATABASE: demo_orders
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: demo_archery
      MYSQL_PASSWORD: demo123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udemo_archery", "-pdemo123"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres_demo:
    image: postgres:16-alpine
    container_name: datamingle-postgres-demo
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
      - "./postgres-demo/init:/docker-entrypoint-initdb.d:ro"
    environment:
      POSTGRES_DB: workflow_pg
      POSTGRES_USER: demo_archery
      POSTGRES_PASSWORD: demo123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_archery -d workflow_pg"]
      interval: 5s
      timeout: 5s
      retries: 20

  archery:
    image: datamingle-app:local-arm
    container_name: datamingle-app
    restart: always
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile.local-arm
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      goinception:
        condition: service_started
      mysql_demo:
        condition: service_healthy
      postgres_demo:
        condition: service_healthy
    ports:
      - "9123:9123"
    volumes:
      - "./archery/settings.py:/opt/archery/local_settings.py"
      - "./archery/soar.yaml:/etc/soar.yaml"
      - "./archery/docs.md:/opt/archery/docs/docs.md"
      - "./archery/downloads:/opt/archery/downloads"
      - "../../sql/migrations:/opt/archery/sql/migrations"
      - "./archery/logs:/opt/archery/logs"
      - "./archery/keys:/opt/archery/keys"
    environment:
      RUN_MIGRATIONS_ON_START: "1"
      RUN_LOCAL_DEMO_SEED: "1"
    entrypoint: "bash /opt/archery/src/docker/startup.sh"
    env_file:
      - .env.local-arm

volumes:
  mysql_demo_data:
    name: datamingle-mysql-demo-data
  postgres_demo_data:
    name: datamingle-postgres-demo-data
